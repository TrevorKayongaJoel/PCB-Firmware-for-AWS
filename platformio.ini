[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; esp32_exception_decoder turns a raw panic backtrace into file:line. Without it a crash
; before Serial is usable looks identical to a power-supply reset.
monitor_filters = send_on_enter, esp32_exception_decoder
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit BME280 Library@^2.3.0
    adafruit/Adafruit ADS1X15@^2.0.0
    adafruit/Adafruit INA219@^1.2.0
    adafruit/RTClib@^2.1.4
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.5
    tzapu/WiFiManager@^2.0.17
    ; ArduinoJson 7 - the code declares plain `JsonDocument` (no capacity template
    ; argument), which only exists in v7. Pinning <7 breaks every payload builder.
    bblanchon/ArduinoJson@^7.0.4
    vshymanskyy/TinyGSM@^0.12.0
    arduino-libraries/ArduinoHttpClient@^0.6.1
    ; Framework-bundled ESP32 HTTPClient. The LDF's chain scan does not pull this in on
    ; its own, and DataLogger.cpp's ThingSpeak uploads will not link without it.
    HTTPClient
